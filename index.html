<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mochila de viagem</title>
    <link rel="stylesheet" href="css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
</head>

<body>
    <main class="conteudo">
        <div class="principal">
            <div class="mochila" aria-hidden="true"></div>
            <form action="" class="adicionar" id="novoItem">
                <h1>Mochila de viagem</h1><p>Organize sua lista. Repetir um nome atualiza a quantidade.</p><label for="nome">Nome</label>
                <input type="text" name="nome" id="nome" required maxlength="100">
                <label for="quantidade">Quantidade</label>
                <input type="number" name="quantidade" id="quantidade" required min="1" step="1">
                <input type="submit" value="Adicionar" class="cadastrar" id="cadastrar">
            </form>
        </div>

        <section aria-label="Itens da mochila"><p id="status" role="status"></p><p id="lista-vazia">Sua mochila está vazia.</p><ul class="lista" id="lista">
        </ul></section>
    </main>

    <script src="./js/main.js"></script>
</body>

</html>
